# Runs the test suites on every push and pull request.
#
# TWO JOBS, deliberately separate:
#
#   fast-tests  — gate A, selector contract, money parity, run-all.js.
#                 No browser, ~5 seconds, and it BLOCKS the functions deploy
#                 (see deploy-functions.yml). This is the real gate.
#
#   browser-tests — Playwright. Slower, needs a 150MB browser download. It
#                 used to be expected to fail (t9, t11, t14, t17 targeted
#                 known Member Portal bugs), but all eight specs in
#                 test/portal.spec.js are green now — those four failures
#                 turned out to be test-harness bugs (a fake portalInvoice
#                 shape, a synchronous fake onSnapshot, a missing
#                 window.paypal.FUNDING, and a spec that tested the wrong
#                 scenario), not real app bugs. continue-on-error is gone —
#                 this job gates like any other now.
#
# ⚠ TWO SESSIONS DISAGREED ABOUT THIS JOB ON 2026-08-14, and this is the
# resolution, recorded so it is not silently flipped back a third time.
# One session DELETED the browser job outright, arguing that a 150MB download
# and a minute per run bought little, and that "a suite nobody acts on is worse
# than none, because it teaches you to dismiss failures". That argument was
# sound WHEN IT WAS MADE — the specs were permanently red, so the job could
# only ever be noise.
# That premise is now false: all eight specs pass. A green suite that goes red
# is a signal, not noise, which is the exact case the deletion was not arguing
# against. So the job stays, gating.
# Note what it does and does not block: this workflow does NOT gate the
# functions deploy (deploy-functions.yml runs its own fast-suite job) and it
# does NOT gate Netlify. So a red browser run is loud and visible without
# standing between a money fix and production.
# If these ever go permanently red again, delete the job rather than adding
# continue-on-error back — a job allowed to fail forever is the thing both
# sessions actually agreed was worthless.
#
# Netlify is NOT gated by this. It publishes the HTML from main regardless of
# whether this run passed — that was a deliberate decision (CLAUDE.md §9.10 and
# the Phase 1 discussion). Netlify's own instant rollback is the safety net for
# the website; this workflow is the safety net for the functions deploy.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # One run per branch. A newer push makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast suite (no browser)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        # ⚠ FULL HISTORY, NOT THE DEFAULT SHALLOW CLONE. docs-current.test.js asks git
        # what this change touched, and a depth-1 checkout has no merge base to compare
        # against — it would report "nothing was judged" on every run, which is a green
        # build for the worst possible reason.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Matches the Node used by the functions deploy workflow so both CI jobs
      # agree about the language they are checking.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install — it installs exactly what package-lock.json
      # pins and FAILS if the lock and package.json have drifted apart. That
      # drift is worth failing on.
      - name: Install dependencies
        run: npm ci

      # Named separately, though `npm test` also runs it. A wrong colour is a bundle
      # nobody can use, and "the colour rules broke" is a different thing to go and look
      # at than a line inside a 4,600-check run. It runs the real normalisers on both
      # sides and fails if the office and the crew screen ever read a word differently.
      - name: What colour a house is (warehouse colour rules)
        run: npm run test:colours

      # A wrong badge is a claim about where a job came from, printed beside somebody's
      # name — worse than no badge. Named separately so a failure reads as "the badge
      # rule broke" rather than a line inside a 4,600-check run.
      - name: Why a bundle is being built (warehouse badges)
        run: npm run test:reason

      # A crew on a Fixer Route gets one piece of paper. If what is wrong is not on it
      # they ring the office or they guess. Named separately for the same reason as the
      # two above: "the fix sheet broke" is a different thing to go and look at.
      - name: What the crew is told is wrong (fix sheet)
        run: npm run test:fix

      # Addie, 2026-09-18: a quote nobody answers is chased on a ladder — we are told to
      # text them, then one automatic email, then it is archived. Named separately because
      # "the nudge ladder" is a thing to go and look at, and because rung one is a REFUSAL:
      # nothing here sends an SMS, and a gate that fails should say which rule broke.
      - name: The nudge ladder (text, email, archived)
        run: npm run test:ladder

      # Addie, 2026-08-31: "I need a subject on all them." Sixteen of the twenty
      # emailjs.send calls in admin.html passed no subject at all, so the RSVP
      # landed in inboxes with a blank subject line. Named separately because
      # "Email subject lines" is a thing to go and look at; the same failure
      # swallowed by npm test is not.
      - name: Every email says what it is (subject lines)
        run: npm run test:subject

      # The browser specs drive the gate-code step against a FAKE Firebase, so
      # they prove what the customer sees and nothing about functions/index.js.
      # A red-check proved it: breaking the real server's return left all ten of
      # them green. This is the half they cannot see.
      - name: The gate code reaches the record (server side)
        run: npm run test:gatecode

      # Addie, 2026-09-10: "changing gate code or phone number should not notify
      # us", and "you should have to apply changes in order for it to go to
      # requote." The claim that actually needs a named failure is a NEGATIVE —
      # the move door writes NO address, town or map pin, because there is no
      # geocoder on the server and the town is what a crew-day is grouped by.
      # Applied here, a customer sits at the new house with the old house's pin,
      # on the old town's day, with a frozen route stop rewritten underneath the
      # crew. Buried in npm test that reads as a generic failure.
      - name: Moving house is recorded, never applied
        run: npm run test:move

      # Addie, 2026-09-01: "turn everyone that hasn't paid from last year or is
      # 60 days over there payment as red for there card." A card that reddens
      # too early is one the office learns to scroll past, so the thresholds
      # are worth a named failure rather than one buried in npm test.
      - name: Whose card is red (seriously behind)
        run: npm run test:redcard

      # Addie, 2026-09-03, finding a customer she had just confirmed sitting on the
      # warehouse list: "it should only be sent to warehouse if there is any sort of
      # change from last year." The rule read the ABSENCE of a recycle flag as proof a
      # bundle had been pulled apart — it is equally absent for somebody nobody ever
      # queued one for. Named separately because both directions cost real money: a
      # spare bundle built for a full bin, or a crew sent to an empty one.
      - name: Does a returning customer need a bundle built
        run: npm run test:rejoin

      # Addie, 2026-09-02: "we should have an x next to all discounts and fees to
      # get rid of those if necessary." Named separately because the one check that
      # matters here is a REFUSAL: last season's carried debt rides in the same fee
      # ledger, and waiving that line lifts the hold keeping an unpaid customer off
      # the schedule — the "hang them anyway" button she was offered and turned down.
      # "A crew was sent to a house that has not paid" deserves its own red line, not
      # one buried in a 3,800-check run.
      - name: Taking a fee or discount off a bill
        run: npm run test:waive

      # Owner, 2026-08-25: "nothing should fail quietly." This one refuses an empty
      # catch block that does not say WHY it is empty — the reason has to be written
      # inside the braces, where it travels with the code rather than three lines
      # above a try that has since moved. Named separately like the three above: "a
      # new swallow went in without a reason" is a one-sentence fix by whoever added
      # it, and reads nothing like a line inside a 5,200-check run.
      - name: Nothing fails quietly (empty catches say why)
        run: npm run test:silent

      # Who tells the warehouse a house needs building. Both bulk importers used to
      # create a customer and never set needsLightBuild, so a house added from a pasted
      # sheet appeared in Needs Building nowhere at all and no bundle was ever made for
      # it. Named separately like the gates above: "an importer stopped queueing a build"
      # is a one-line fix by whoever changed it, and reads nothing like a line inside the
      # big suite. The most expensive thing it holds is the other direction — that an
      # import which MATCHES an existing customer never re-queues them, because these
      # tools write hundreds of records a press.
      - name: Who tells the warehouse a house needs building
        run: npm run test:import-build

      # Is everything still connected. The connections map declares, by hand, what ought
      # to reach what — and this fails the build when the code stops making one of those
      # connections. Addie, asked how she should find out when it goes red: "It fails the
      # build." Named separately like the gates above, because "a connection somebody
      # relies on is gone" is a different thing to go and look at than a line inside the
      # big suite. ⚠ Amber — a writer nobody declared — is a NOTE and never a failure: a
      # gate that goes red every time somebody adds a legitimate reader gets disabled
      # inside a week.
      - name: Is everything still connected (the connections map)
        run: npm run test:connections

      # Addie's rulings. Named separately for the same reason as the three above:
      # "a ruling lost its pointer" is a different thing to go and look at than a line
      # inside a 4,600-check run. ⚠ IT RUNS HERE AND LAST IN `npm test`, on purpose and
      # for two different reasons — here so a CI failure reads legibly before the big
      # suite swallows it, and last locally so its standing reminder is the final thing
      # printed rather than being buried under the suite's own summary.
      - name: The schedule hold and where a re-quote lands
        run: npm run test:hold
      # ⭐ WHO IS HELD BECAUSE LAST SEASON'S BILL WAS NEVER PAID. Named separately
      # because it is two rules at once — money that is now carried instead of written
      # off, and who may be sent a crew — and "a customer who paid is being held" is a
      # different thing to go and look at than a line inside the big suite.
      - name: Last season's unpaid bill (carried, and holding the season)
        run: npm run test:arrears
      # ⭐ WHEN SOMETHING GOES WRONG, SOMEBODY IS TOLD. Named separately because a
      # failure here is invisible in production by construction: the whole feature is
      # about reporting faults nobody was watching, so if the reporter itself breaks,
      # the only symptom is a folder that quietly stays empty — which reads exactly
      # like a good week.
      - name: Errors reach the Inbox (member and admin)
        run: npm run test:errors
      # ⭐ GMAIL FIRST, THE INBOX ONLY ON FAILURE. Named separately because a break here
      # is silent in the worst direction: the Inbox copy is now the FALLBACK, so a bug
      # that makes the sender report success when it did not send drops every customer
      # message at both ends and the only symptom is an Inbox that looks pleasantly
      # quiet. The Playwright specs cannot cover it — their stub never configures
      # EmailJS, so all 177 of them only ever exercise the fallback branch.
      - name: Messages go to the Gmail, and only fall back to the Inbox
        run: npm run test:msgfallback
      # ⭐ THE RSVP, A FEW HUNDRED A MORNING. Named separately because the failure it
      # guards is silence of exactly the same shape: the drip runs at 9 AM with nobody
      # watching, and the two ways it can go wrong — refusing every morning because it
      # cannot find a template, or stamping somebody who was never emailed — both look
      # from outside like a season where people simply did not reply. A customer wrongly
      # stamped is dropped from the routes, the build queue and the schedule.
      - name: The RSVP goes out a few hundred a morning
        run: npm run test:rsvp-daily
      # ⭐ THE AUTO-REPLY WHEN A MEMBER CHANGES SOMETHING. Named separately because both
      # ways it fails are invisible from here and land only in a customer's inbox: fire it
      # on an untouched form and the whole book is emailed about changes nobody made (the
      # preferences form posts all six fields every save, and an unticked box arrives as ''
      # while the record stores false); break it the other way and it silently never sends,
      # which looks exactly like a switch that was never turned on.
      - name: The member-portal auto-reply
        run: npm run test:pce
      # ⭐ CLEARING A WIRE COLOUR NOBODY WROTE DOWN. Named separately because this one
      # writes to customer records in BULK, and every way it can go wrong is silent:
      # clearing a colour the office really picked because the sheet is merely incomplete,
      # clearing a Green the bug could never have written, matching the wrong customer on
      # a shared name — or matching nobody at all and reporting a clean book, which is
      # exactly how a broken sheet reader would look.
      - name: Wire colours nobody wrote down
        run: npm run test:wiresweep
      # ⭐ BLUEPRINT MAPS — the batch is whatever is showing. Named separately because
      # what it guards is a SHEET somebody drives away with: a tile dropped between pages,
      # a saved copy count quietly read as 1, or a map still ticked after the office
      # unchecked it are all invisible on screen and only show up as a crew standing in
      # front of a house with no drawing for it.
      - name: Blueprint maps (the batch and the sheet)
        run: npm run test:blueprint
      # Named on its own because the failure it catches is a sheet that prints
      # without something the office typed for the warehouse — invisible on screen,
      # and only noticed by somebody standing at a shelf with the wrong paper.
      - name: Warehouse note (both build sheets carry it)
        run: npm run test:whnote
      - name: Warehouse request (it changes the customer, and it charges)
        run: npm run test:whrequest
      # Named on its own because of what it protects rather than how often it
      # changes: the Archive is the LAST copy of anybody the office removed, and
      # this is the one button that can destroy it. A row whose `recycled` is
      # false is also that customer's only place on the warehouse recycle queue —
      # deleting it loses a real job with nothing left to rebuild it from.
      - name: Deleting one archived record (the last copy)
        run: npm run test:archdel
      # Named on its own because the failure it catches is a send that does not
      # happen. The re-quote template is looked up by EXACT name, so a template
      # called anything but "ReQuotes" made every re-quote off an existing customer
      # refuse — while first quotes fell back to a built-in body and kept going out.
      # One kind of email silently missing is not something a generic npm test
      # failure should be allowed to bury.
      - name: Re-quote emails (the send has no dead end)
        run: npm run test:requote-email
      # Named on its own because this card WRITES A COLOUR ONTO A CUSTOMER RECORD and
      # closes the only notice that asks for one. Once it is written, no screen anywhere
      # can tell a colour this button set from one a person chose at the bin — so a
      # failure here is a wrong answer nobody can find afterwards, not a broken page.
      - name: Pick a wire colour (the one door that answers it)
        run: npm run test:wirepick
      # Named on its own because its failure is the silent kind. The texted address is
      # ONE CLAIM WRITTEN TWICE — admin.html builds it, index.html parses it — so a
      # change to either side leaves the office texting several hundred customers a link
      # that opens the marketing site, with nothing on screen and no error anywhere. The
      # other half it holds is the confirm-tap bypass the answer page needs: that guard
      # exists because a mail scanner really did answer for two customers at 3:42am.
      - name: One link, three answers (the text-message RSVP)
        run: npm run test:textrsvp
      # And what that one link SAYS. The wording is a template she edits in Automation
      # Emails now, so the failure this names is a silent one: a template renamed or
      # deleted answers exactly like a template list that has not loaded, and falling
      # back in the second case sends the built-in sentence over the top of the wording
      # she chose, to several hundred people, with every other gate green.
      - name: What the RSVP text actually says
        run: npm run test:textwording
      - name: Addie's rulings (the questions map)
        run: npm run test:questions

      # What changed on a customer, in words. Named separately for the same reason as
      # the gates above: this one fails when a field the Edit Customer form writes has
      # no label, and the effect of that is SILENCE — edits to it never appear in
      # anybody's history, which reads exactly like the field never being edited. A
      # failure called "Change log" says that; one swallowed by npm test does not.
      - name: What changed on a customer
        run: npm run test:changes

      # One route note a day. Named separately because its failure is the quiet kind:
      # the route sweep runs every fifteen minutes and has already rewritten real routes
      # by the time it reports, so a broken digest is not an error on screen, it is days
      # moving with nobody told. A failure called "Route notices" says which; one
      # swallowed by npm test does not.
      - name: Route notices (one digest a day)
        run: npm run test:digest

      # What the customer's own page can actually see. Named separately because its
      # failure is invisible by construction: a field missing from PORTAL_READ_FIELDS
      # arrives as undefined, the `|| ''` fallbacks turn it into a plausible empty, and
      # the page renders as though the record held nothing. Nothing throws.
      - name: What the portal can see (the read whitelist)
        run: npm run test:portal-fields

      # Every Firestore collection is written down. Named separately because the two
      # things it catches are both silent: a collection missing from system-map.md leaves
      # a heading reading "Every Firestore collection" telling a half-truth to the one
      # person who reads it instead of the code, and a collection missing from
      # firestore.rules is denied by default and renders an empty panel rather than an
      # error.
      - name: Every collection is written down
        run: npm run test:collections

      # ⭐⭐ THE HEADLINE RULES (SCH-85, SCH-86): every Confirmed customer is on a day
      # after Recalculate, and All Customers shows the Schedule's day. Its own named step
      # so a red here reads as "a headline rule was broken" — see headline-rules.test.js.
      - name: The headline rules still hold (Confirmed = scheduled, All Customers = Schedule)
        run: npm run test:headline

      - name: Run the fast suite
        run: npm test

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        # ⚠ FULL HISTORY, NOT THE DEFAULT SHALLOW CLONE. docs-current.test.js asks git
        # what this change touched, and a depth-1 checkout has no merge base to compare
        # against — it would report "nothing was judged" on every run, which is a green
        # build for the worst possible reason.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps also installs the system libraries headless Chromium needs
      # on a bare Ubuntu runner. Without it the browser installs but won't launch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser specs
        run: npm run test:browser

      # Traces and failure screenshots, kept only when something failed —
      # this is how you see what a red run actually looked like without
      # reproducing it locally.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
