# Runs the test suites on every push and pull request.
#
# TWO JOBS, deliberately separate:
#
#   fast-tests  — gate A, selector contract, money parity, run-all.js.
#                 No browser, ~5 seconds, and it BLOCKS the functions deploy
#                 (see deploy-functions.yml). This is the real gate.
#
# The Playwright browser job was REMOVED from CI on 2026-08-14, deliberately.
# The specs still exist in test/ and still work — see test/portal.spec.js — but
# they are not run automatically any more.
#
# Why: they need a 150MB browser download and a machine to run on, they take a
# minute rather than five seconds, and running them meant keeping a local clone
# in step with GitHub. In practice that produced far more friction than signal.
# The owner runs this business; a suite that needs babysitting is a suite that
# gets ignored, and an ignored suite is worse than none because it teaches you
# to dismiss failures.
#
# To run them by hand at any point:
#     npx playwright install chromium   (once per machine)
#     npm run test:browser
# Claude Code can run and fix them directly, which is the sane way to pick this
# up again. Do NOT re-add them to CI without also having someone who will
# actually act on a red run.
#
# Netlify is NOT gated by this. It publishes the HTML from main regardless of
# whether this run passed — that was a deliberate decision (CLAUDE.md §9.10 and
# the Phase 1 discussion). Netlify's own instant rollback is the safety net for
# the website; this workflow is the safety net for the functions deploy.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # One run per branch. A newer push makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast suite (no browser)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Matches the Node used by the functions deploy workflow so both CI jobs
      # agree about the language they are checking.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install — it installs exactly what package-lock.json
      # pins and FAILS if the lock and package.json have drifted apart. That
      # drift is worth failing on.
      - name: Install dependencies
        run: npm ci

      - name: Run the fast suite
        run: npm test
