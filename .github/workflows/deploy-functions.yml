# Auto-deploys Firebase Cloud Functions whenever functions code changes on main.
#
# Requires one repository secret named FIREBASE_SERVICE_ACCOUNT containing the
# JSON key of a Google Cloud service account with deploy permissions.
#
# The "Who am I deploying as?" step exists to debug permission errors: it
# prints the service account email inside the secret and the roles that
# account ACTUALLY holds on the project — as saved, not as intended. It never
# prints the private key.

name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch: {}

concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Keep this matching "engines.node" in functions/package.json. If they
      # drift, CI builds against one Node and Google runs the function on
      # another, which is exactly the kind of difference that only shows up
      # in production.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase tools
        run: npm install -g firebase-tools

      - name: Write service account key to a temp file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Who am I deploying as?
        run: |
          echo "=== Identity inside the GitHub secret ==="
          jq -r '"client_email: " + .client_email' "$RUNNER_TEMP/firebase-sa.json"
          jq -r '"project_id:   " + .project_id' "$RUNNER_TEMP/firebase-sa.json"
          echo ""
          echo "=== Roles this identity ACTUALLY holds on highlighting-utah ==="
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          SA_EMAIL=$(jq -r .client_email "$RUNNER_TEMP/firebase-sa.json")
          gcloud projects get-iam-policy highlighting-utah \
            --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:$SA_EMAIL" \
            --format="value(bindings.role)" || echo "(could not read project IAM policy)"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: firebase deploy --only functions --project highlighting-utah --non-interactive --force
